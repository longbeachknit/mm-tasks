<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>モルマニ タスク管理</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#FFFAEB;--card:#fff;--ink:#1a1a1a;--sub:#6b7280;--line:#EFE7CC;
  --accent:#FFCB3D;--accent-strong:#F2B705;--accent-ink:#2b2100;--accent-soft:#FFF3C4;--link:#9a6700;
  --danger:#E24B4A;--danger-soft:#FFF0EF;--warn:#b45309;--warn-soft:#FFF3C4;--ok:#1D9E75;--ok-soft:#E3F6EF;--wip:#7a5af8;--wip-soft:#f0edff;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#16130b;--card:#211d13;--ink:#f3efe2;--sub:#a8a293;--line:#3a3322;
  --accent:#FFCB3D;--accent-strong:#F2B705;--accent-ink:#2b2100;--accent-soft:#3a3013;--link:#FFCB3D;
  --danger:#ff7b6e;--danger-soft:#3a1f1c;--warn:#f5b84a;--warn-soft:#3a3013;--ok:#3cc795;--ok-soft:#163328;--wip:#a48afb;--wip-soft:#2a2342;
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--link)}
header{position:sticky;top:0;z-index:5;background:var(--accent);color:var(--accent-ink);box-shadow:0 1px 0 rgba(0,0,0,.08)}
.bar{max-width:980px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.bar h1{font-size:17px;margin:0;flex:1;white-space:nowrap;font-weight:800;letter-spacing:.02em}
.badge{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--accent-ink);color:var(--accent);white-space:nowrap;font-weight:700}
nav{max-width:980px;margin:0 auto;padding:0 8px;display:flex;gap:2px;overflow-x:auto}
nav button{border:0;background:none;padding:8px 13px;border-radius:10px 10px 0 0;color:rgba(43,33,0,.7);white-space:nowrap;cursor:pointer;font-weight:600}
nav button.on{color:var(--ink);background:var(--bg);font-weight:800}
main{max-width:980px;margin:0 auto;padding:16px 16px 80px}
h2{font-size:15px;margin:22px 0 8px;display:flex;align-items:center;gap:8px}
h2 .n,.dayhead .n{font-size:12px;font-weight:400;color:var(--sub)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.muted{color:var(--sub);font-size:13px}
.empty{color:var(--sub);font-size:13px;padding:10px 2px}
.btn{border:1px solid var(--line);background:var(--card);padding:7px 12px;border-radius:10px;cursor:pointer;white-space:nowrap;font-weight:600}
.btn.pri{background:var(--accent);border-color:var(--accent-strong);color:var(--accent-ink);font-weight:800}
.btn.pri:hover{background:var(--accent-strong)}
.btn.dan{color:var(--danger)}
.btn.sm{padding:3px 9px;font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:3px 11px;font-size:13px;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent-strong);color:var(--accent-ink);font-weight:700}
.tag{font-size:11px;padding:1px 7px;border-radius:99px;background:var(--accent-soft);color:var(--link);white-space:nowrap}
.tag.gray{background:var(--bg);color:var(--sub);border:1px solid var(--line)}
.toolbar{display:flex;gap:10px 18px;flex-wrap:wrap;align-items:center}
/* tasks */
.list{display:flex;flex-direction:column;gap:6px}
.task{display:flex;align-items:flex-start;gap:10px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--c,var(--line));border-radius:10px;padding:9px 10px}
.task.late{background:var(--danger-soft)}
.task.late .t::after{content:'期限切れ';font-size:10px;font-weight:700;color:#fff;background:var(--danger);border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:2px}
.task.st-wip{box-shadow:inset 0 0 0 1px var(--wip)}
.task.st-done{opacity:.55}
.task.st-done .t{text-decoration:line-through}
.st{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:var(--card);cursor:pointer;font-size:14px;line-height:1;display:grid;place-items:center}
.st-wip .st{border-color:var(--wip);color:var(--wip);background:var(--wip-soft)}
.st-done .st{border-color:var(--ok);color:#fff;background:var(--ok)}
.task .body{flex:1;min-width:0;cursor:pointer}
.task .t{font-weight:600;word-break:break-word}
.meta{display:flex;gap:4px 10px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin-top:2px}
.meta .late{color:var(--danger);font-weight:600}
.meta .noone{color:var(--warn)}
.meta .cm{color:var(--link);font-weight:600}
.man{flex:none;font-size:12px;text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:3px 8px;align-self:center}
.man.none{color:var(--sub);border-style:dashed}
.dayhead{font-size:13px;font-weight:600;margin:14px 0 4px;color:var(--sub)}
.dayhead.today{color:var(--link)}
.dayhead.late{color:var(--danger)}
.prog{height:7px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 2px}
.prog i{display:block;height:100%;background:var(--ok)}
.ev{cursor:pointer}
.ev .nm{font-weight:600}
.alert{background:var(--danger-soft);color:var(--danger);border-radius:8px;padding:8px 12px;font-size:13px;margin-top:8px}
.note{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:13px}
/* comments */
.cmt{background:var(--bg);border-radius:8px;padding:7px 10px;margin-bottom:6px}
.cmt .ch{display:flex;gap:8px;align-items:center;font-size:12px}
.cmt .cb{font-size:14px;margin-top:2px;word-break:break-word}
.feed{cursor:pointer}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal .wd{font-size:12px;text-align:center;color:var(--sub);padding:2px 0}
.cell{min-height:74px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:3px;cursor:pointer;overflow:hidden;font-size:11px}
.cell.out{opacity:.4}
.cell.sel{outline:2px solid var(--accent-strong)}
.cell .d{font-size:12px;font-weight:600}
.cell.td .d{color:var(--accent-ink);background:var(--accent);border-radius:99px;padding:0 6px;display:inline-block}
.cell .evc{display:block;color:#fff;border-radius:4px;padding:0 3px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .cnt{display:inline-block;margin-top:2px;padding:0 5px;border-radius:99px;background:var(--accent-soft);color:var(--link)}
.cell .cnt.late{background:var(--danger-soft);color:var(--danger)}
.cell .rt{display:block;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* tables */
.tbl{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.tbl td,.tbl th{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:14px;vertical-align:top}
.tbl th{font-size:12px;color:var(--sub);font-weight:600;background:var(--bg)}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--accent-soft)}
/* modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 12px;z-index:20;overflow:auto}
.modal{background:var(--card);border-radius:12px;width:100%;max-width:560px;padding:16px}
.modal h3{margin:0 0 12px;font-size:16px}
.modal h4{margin:16px 0 6px;font-size:14px}
.f{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.f>label,.lbl{font-size:12px;color:var(--sub);font-weight:600}
.f input,.f select,.f textarea,.inp{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg);width:100%}
.f textarea,textarea.inp{min-height:64px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input[type=checkbox]{width:auto!important;padding:0;margin:0;flex:none;accent-color:var(--accent-strong)}
.ck{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
.pick{max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:6px 10px 10px;background:var(--bg);margin:4px 0 10px}
.pick .pcat{margin-top:10px;font-weight:600}
.pick .it{padding:2px 0 2px 24px;align-items:flex-start}
.pick .it input{margin-top:4px}
.pick .d{color:var(--sub);font-size:12px;min-width:54px;display:inline-block}
.foot{display:flex;gap:8px;margin-top:14px}
/* 第3版 */
.task.st-skip{opacity:.5}
.task.st-skip .t{text-decoration:line-through}
.st-skip .st{border-color:var(--sub);color:var(--sub)}
.skipbtn{flex:none;font-size:12px;border:1px solid var(--line);background:var(--card);border-radius:6px;padding:3px 8px;cursor:pointer;color:var(--sub);align-self:center}
.skipbtn:hover{color:var(--danger);border-color:var(--danger)}
.meta .who{color:var(--ok);font-weight:600}
.cell .ct{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink);font-size:11px;line-height:1.35}
.cell .ct.late{color:var(--danger)}
.cell .ct i{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:3px;vertical-align:1px}
.cell .more{display:block;color:var(--sub)}
@media (min-width:561px){.cell{min-height:104px}.cell .cnt{display:none}}
@media (max-width:560px){.cell .ct,.cell .more{display:none}}
.stat{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.stat .card b{font-size:20px}
.barbg{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:4px}
.barbg i{display:block;height:100%;background:var(--accent-strong)}
/* 第4版 */
.lk{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.lk .man{align-self:auto}
.side{display:flex;gap:6px;align-items:center;align-self:center;flex:none}
.chatbtn{position:relative;font-size:13px;border:1px solid var(--line);background:var(--card);border-radius:6px;padding:3px 8px;cursor:pointer;color:var(--sub)}
.chatbtn.has{color:var(--link);border-color:var(--accent)}
.rdot{position:absolute;top:-4px;right:-4px;width:10px;height:10px;border-radius:50%;background:#e5484d;border:2px solid var(--card)}
.dot{display:inline-block;min-width:17px;height:17px;border-radius:99px;background:#e5484d;color:#fff;font-size:10px;line-height:17px;text-align:center;margin-left:4px;padding:0 4px;font-weight:700}
.who.edit{cursor:pointer;text-decoration:underline dotted}
.mini{width:70px;border:1px solid var(--line);border-radius:6px;padding:3px 6px;background:var(--bg);text-align:right}
.chatrow{cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.chatrow .b{flex:1;min-width:0}
.chatrow .last{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chatrow.unread{border-color:#e5484d}
.seen{font-size:11px;color:var(--sub);text-align:right;margin:-2px 0 6px}
/* 第5版：カテゴリの色 */
.cat{display:inline-flex;align-items:center;gap:4px;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--ink);border-radius:99px;padding:0 8px;font-weight:600}
.cat i,.cdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.dayhead.cathead{display:flex;align-items:center;gap:6px;color:var(--ink);border-left:5px solid var(--c);background:color-mix(in srgb,var(--c) 10%,transparent);border-radius:0 8px 8px 0;padding:4px 8px}
.catprog{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.catprog .cp{font-size:12px;border-radius:8px;padding:3px 8px;background:color-mix(in srgb,var(--c) 13%,transparent);border-left:4px solid var(--c);cursor:pointer}
.catprog .cp.done{opacity:.5}
.colorpick{width:30px;height:26px;padding:0;border:1px solid var(--line);border-radius:6px;background:none;cursor:pointer}
.evsub{font-size:12px;color:var(--sub);word-break:break-word}
.login .card{border-top:6px solid var(--accent)}
#newver{position:fixed;top:0;left:0;right:0;z-index:40;background:var(--accent-ink);color:var(--accent);padding:8px 16px;display:none;align-items:center;justify-content:center;gap:12px;font-size:14px}
#newver button{background:var(--accent);color:var(--accent-ink);border:0;border-radius:6px;padding:4px 12px;font-weight:600;cursor:pointer}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:14px;display:none;z-index:30;max-width:90vw}
.login{max-width:360px;margin:12vh auto;padding:0 16px}
@media (max-width:560px){.cell{min-height:56px}.cell .evc,.cell .rt{display:none}.cell .evd{display:block;width:6px;height:6px;border-radius:50%;margin-top:3px}.f2{grid-template-columns:1fr}}
@media (min-width:561px){.cell .evd{display:none}}
</style>
</head>

<script>
/* ============================================================

const APP_VERSION='20261029-204757';   // 反映のたびに変える（新しい版のお知らせに使う）
const TABLES = ['members','template_sets','categories','templates','events','tasks','routines','routine_checks','comments','comment_reads'];
const S = {members:[],template_sets:[],categories:[],templates:[],events:[],tasks:[],routines:[],routine_checks:[],comments:[],comment_reads:[],staff:[]};
const ui = {tab:'home', who:lsGet('mm_who')||'', sort:lsGet('mm_sort')||'date', eventId:null, evFilter:'', setId:null,
  calMonth:null, calDay:null, user:null, isAdmin:false, noAccess:false};
const DEFAULT_SET_ID='00000000-0000-4000-8000-000000000001';

/* ---------- 小さな道具 ---------- */
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
const WD=['日','月','火','水','木','金','土'];
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const diffDays=(a,b)=>Math.round((parse(a)-parse(b))/864e5);
const today=()=>ymd(new Date());
const uid=()=>(crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-8xxx-xxxxxxxxxxxx'.replace(/x/g,()=>(Math.random()*16|0).toString(16)));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const md=s=>{const d=parse(s);return `${d.getMonth()+1}/${d.getDate()}(${WD[d.getDay()]})`};
const rel=s=>{const n=diffDays(s,today());return n===0?'今日':n===1?'明日':n>0?`あと${n}日`:`${-n}日過ぎ`};
const daysLabel=n=>n<0?`${-n}日前`:n===0?'当日':`${n}日後`;
const fmtTime=iso=>{const d=new Date(iso);return `${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`};
const bySort=(a,b)=>(a.sort||0)-(b.sort||0);
function catList(){return [...S.categories].sort(bySort).map(c=>c.name)}
function catIndex(n){const i=catList().indexOf(n);return i<0?999:i}
const byDue=(a,b)=>a.due<b.due?-1:a.due>b.due?1:(catIndex(a.category)-catIndex(b.category))||bySort(a,b);
const CAT_COLORS=['#3B82F6','#E8590C','#1D9E75','#8B5CF6','#EC4899','#14B8A6','#E24B4A','#84CC16','#0EA5E9','#A855F7','#F97316','#64748B'];
function catColor(n){const l=[...S.categories].sort(bySort);const i=l.findIndex(c=>c.name===n);if(i<0)return '#9ca3af';return l[i].color||CAT_COLORS[i%CAT_COLORS.length]}
const catChip=n=>n?`<span class="cat" style="--c:${catColor(n)}"><i></i>${esc(n)}</span>`:'';
const sets=()=>[...S.template_sets].sort(bySort);
const setById=id=>S.template_sets.find(s=>s.id===id);
const evById=id=>S.events.find(e=>e.id===id);
const memName=id=>(S.members.find(m=>m.id===id)||{}).name||'';
const myEmail=()=>DB.mode==='cloud'?((ui.user&&ui.user.email)||'').toLowerCase():'demo@local';
const myName=()=>{const s=S.staff.find(x=>x.email===myEmail());return s&&s.name?s.name:(DB.mode==='cloud'?myEmail():'あなた')};
const EV_COLORS=['#2f6fed','#e8590c','#0ca678','#ae3ec9','#d6336c','#1098ad','#f59f00','#5c7cfa'];
function evColor(id){const sorted=[...S.events].sort((a,b)=>a.date<b.date?-1:1);const i=sorted.findIndex(e=>e.id===id);return EV_COLORS[(i<0?0:i)%EV_COLORS.length]}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',3200)}
function loadScript(src){return new Promise((ok,ng)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=ng;document.head.appendChild(s)})}

/* ---------- テンプレの初期データ（スプレッドシート「【テンプレ】大会別タスクチェック」より） ----------
   [カテゴリ, タスク, 大会日から何日（マイナス＝前／プラス＝後）, マニュアル名, メモ] */
const SEED_TEMPLATES = [
  ['告知','募集サイト作成',-100,'【マニュアル】Peatix_大会ページ作成'],

  ['賞品','賞品発注（大会オリジナル）',-18],
  ['賞品','HRDに連絡',-18],
  ['賞品','松葉屋本店に連絡',-18],
  ['賞品','賞状発注',-14,'【マニュアル】賞状発注'],
  ['賞品','キーホルダー発注',-14,'【マニュアル】キーホルダー発注'],
  ['賞品','缶バッチ購入',-14,'【マニュアル】缶バッチ発注'],
  ['賞品','賞状ケース等購入',-7],
  ['賞品','発注系ダブルチェック',-7],
  ['賞品','じゃんけん大会用パネル作成',-7],
  ['賞品','じゃんけん大会用パネル印刷',-3],
  ['賞品','賞品到着最終確認',-3],
  ['対戦表・OSS','レギュレーション決定',-14],
  ['対戦表・OSS','テンプレ作成',-10],
  ['対戦表・OSS','テンプレダブルチェック',-7],

  S.categories = [...new Set([...SEED_TEMPLATES.map(r=>r[0]),'その他'])].map((n,i)=>({id:uid(),name:n,sort:i}));

/* 古いデータに足りないもの（テンプレ一式・カテゴリ）を補う。足したものを返す */
function fillMissing(){
  const ups={};
  if(!S.templates.length&&!S.routines.length){
    seedBase(); return {template_sets:S.template_sets,templates:S.templates,categories:S.categories,routines:S.routines};
  }
  if(!S.template_sets.length){S.template_sets=[{id:DEFAULT_SET_ID,name:'標準',memo:'',sort:0}];ups.template_sets=S.template_sets}
  const orphan=S.templates.filter(t=>!t.set_id);
  if(orphan.length){orphan.forEach(t=>t.set_id=sets()[0].id);ups.templates=orphan}
  const have=new Set(S.categories.map(c=>c.name));
  const missing=[...new Set([...S.templates,...S.tasks].map(t=>t.category).filter(n=>n&&!have.has(n)))];
  if(missing.length){const add=missing.map((n,i)=>({id:uid(),name:n,sort:S.categories.length+i}));S.categories.push(...add);ups.categories=add}
  return ups;
}

const CloudDB = {
  mode:'cloud', sb:null,

    if(!window.supabase) await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js');

  },
  async upsert(t,rows){if(!rows.length)return;const {error}=await this.sb.from(t).upsert(rows);if(error)throw error},
  async remove(t,ids){const {error}=await this.sb.from(t).delete().in('id',ids);if(error)throw error},
};
const DB = CONFIG.SUPABASE_URL && !CONFIG.SUPABASE_URL.startsWith('__') ? CloudDB : LocalDB;

async function put(t,rows){
  rows=[].concat(rows); if(!rows.length) return;
  for(const r of rows){const i=S[t].findIndex(x=>x.id===r.id); if(i>=0) S[t][i]=r; else S[t].push(r);}
  render();
  try{await DB.upsert(t,rows)}catch(e){toast('保存に失敗しました：'+e.message+'（再読み込みしてください）')}
}
async function del(t,ids){
  ids=[].concat(ids); if(!ids.length) return;
  S[t]=S[t].filter(x=>!ids.includes(x.id));
  render();
  try{await DB.remove(t,ids)}catch(e){toast('削除に失敗しました：'+e.message)}
}

/* タスクを「日付ごと」または「カテゴリごと」に見出しをつけて並べる */
function grouped(ts,{ev=null,showEvent=true,headless=false}={}){
  ts=[...ts].sort(byDue);
  if(ui.sort==='cat'){
    const cats=[...new Set(ts.map(x=>x.category||'（カテゴリなし）'))].sort((a,b)=>catIndex(a)-catIndex(b));
    return cats.map(c=>{const items=ts.filter(x=>(x.category||'（カテゴリなし）')===c);const d=items.filter(x=>!isOpen(x)).length;
      return `<div class="dayhead cathead" style="--c:${catColor(c)}">${esc(c)}　<span class="n">${ev?`完了 ${d}/${items.length}`:`${items.length}件`}</span></div>
        <div class="list">${items.map(x=>taskRow(x,{showEvent})).join('')}</div>`}).join('');
  }
  if(headless) return `<div class="list">${ts.map(x=>taskRow(x,{showEvent})).join('')}</div>`;
  const t=today();
  return [...new Set(ts.map(x=>x.due))].map(d=>{
    const items=ts.filter(x=>x.due===d);
    const cls=d===t?'today':(d<t&&items.some(x=>isOpen(x))?'late':'');
    return `<div class="dayhead ${cls}">${md(d)}${ev?'　'+daysLabel(diffDays(d,ev.date)):''}　<span class="n">${rel(d)}・${items.length}件</span></div>
      <div class="list">${items.map(x=>taskRow(x,{showEvent})).join('')}</div>`;
  }).join('');
}

  const recent=S.comments.filter(c=>c.created_at>=since).sort((a,b)=>a.created_at>b.created_at?-1:1).slice(0,6);
  return `${toolbar()}
    <h2>期限切れ <span class="n">${late.length}件</span></h2>${section(late,'期限切れはありません 🎉',{headless:true})}
    <h2>今日まで <span class="n">${md(t)}・${now.length}件</span></h2>${section(now,'今日が期限のタスクはありません',{headless:true})}
    <h2>今日のルーティン</h2>${listOr(rts,r=>routineRow(r,t),'今日のルーティンはありません')}
    ${todayDone()}
    <h2>これから7日間 <span class="n">${week.length}件</span></h2>${section(week,'この1週間に期限のタスクはありません')}
    ${recent.length?`<h2>最近のやり取り <span class="n">7日以内</span></h2><div class="list">${recent.map(c=>{const tk=S.tasks.find(x=>x.id===c.task_id);if(!tk)return'';const ev=tk.event_id&&evById(tk.event_id);
      return `<div class="card feed" data-act="editTask" data-id="${tk.id}"><div class="muted">${esc(tk.title)}${ev?`（${esc(evName(ev))}）`:''}・${fmtTime(c.created_at)}</div><div><b>${esc(c.author_name||c.author_email)}</b>：${esc(c.body.slice(0,80))}</div></div>`}).join('')}</div>`:''}
    <h2>近くの大会</h2>${upcoming.length?`<div class="grid">${upcoming.map(evCard).join('')}</div>`:'<div class="empty">登録された大会はありません</div>'}`;
}

function todayDone(){
  const t=today(), ds=S.tasks.filter(x=>!isOpen(x)&&doneDay(x)===t).sort((a,b)=>a.done_at<b.done_at?1:-1);
  const rc=S.routine_checks.filter(c=>c.date===t).length;
  if(!ds.length) return `<h2>今日やったこと</h2><div class="empty">まだありません${rc?`（ルーティン ${rc}件はチェック済み）`:''}</div>`;
  const by={}; ds.filter(x=>x.status==='done').forEach(x=>{const k=x.done_by||'（不明）';by[k]=(by[k]||0)+Number(x.effort||0)});
  return `<h2>今日やったこと <span class="n">${ds.length}件</span></h2>
    <div class="chips" style="margin-bottom:6px">${Object.entries(by).map(([k,m])=>`<span class="tag gray">${esc(k)}：工数${m}</span>`).join('')}</div>
    <div class="list">${ds.map(x=>taskRow(x)).join('')}</div>`;
}
function viewReport(){
  const p=ui.period||'week', t=today();
  const from={today:t,week:addDays(t,-6),month:t.slice(0,8)+'01',all:'0000-00-00'}[p];
  const ds=S.tasks.filter(x=>x.status==='done'&&doneDay(x)&&doneDay(x)>=from);
  const by={}; ds.forEach(x=>{const k=x.done_by||'（不明）';(by[k]=by[k]||{n:0,m:0});by[k].n++;by[k].m+=Number(x.effort||0)});
  const rows=Object.entries(by).sort((a,b)=>b[1].m-a[1].m||b[1].n-a[1].n);
  const max=Math.max(1,...rows.map(r=>r[1].m));
  const total=ds.reduce((a,x)=>a+Number(x.effort||0),0);
  const days=[...new Set(ds.map(doneDay))].sort().reverse();
  const P=[['today','今日'],['week','この7日間'],['month','今月'],['all','すべて']];
  return `<div class="chips"><span class="muted">期間：</span>${P.map(([k,l])=>`<button class="chip ${p===k?'on':''}" data-act="period" data-id="${k}">${l}</button>`).join('')}</div>
    <div class="stat" style="margin-top:12px"><div class="card"><div class="muted">完了したタスク</div><b>${ds.length}件</b></div>
      <div class="card"><div class="muted">工数の合計</div><b>${fmtMin(total)}</b></div></div>
    <h2>人ごとの実績</h2>
    ${rows.length?`<table class="tbl"><tr><th>人</th><th style="width:70px">件数</th><th>工数</th></tr>${rows.map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v.n}件</td>
      <td>${fmtMin(v.m)}<div class="barbg"><i style="width:${Math.round(v.m/max*100)}%"></i></div></td></tr>`).join('')}</table>`:'<div class="empty">この期間に完了したタスクはありません</div>'}
    <div class="muted" style="margin-top:6px">※「完了」を押した人の実績として数えます。工数が0のタスクは件数だけに入ります。</div>
    <h2>完了したタスク</h2>
    ${days.map(d=>`<div class="dayhead">${md(d)}　<span class="n">${ds.filter(x=>doneDay(x)===d).length}件</span></div>
      <div class="list">${ds.filter(x=>doneDay(x)===d).sort((a,b)=>a.done_at<b.done_at?1:-1).map(x=>taskRow(x)).join('')}</div>`).join('')||''}`;
}
function viewEvents(){

  const up=S.events.filter(e=>e.date>=t&&pass(e)).sort((a,b)=>a.date<b.date?-1:1);
  const past=S.events.filter(e=>e.date<t&&pass(e)).sort((a,b)=>a.date>b.date?-1:1);
  return `<div class="row"><span class="muted">大会を登録すると、選んだテンプレからタスクが日付つきで自動で作られます。</span><span class="sp"></span>
    <button class="btn pri" data-act="newEvent">＋ 大会を登録</button></div>
    ${sets().length>1?`<div class="chips" style="margin-top:10px"><span class="muted">テンプレ：</span><button class="chip ${!f?'on':''}" data-act="evFilter" data-id="">すべて</button>
      ${sets().map(s=>`<button class="chip ${f===s.id?'on':''}" data-act="evFilter" data-id="${s.id}">${esc(s.name)}</button>`).join('')}</div>`:''}
    <h2>これからの大会 <span class="n">${up.length}件</span></h2>${up.length?`<div class="grid">${up.map(evCard).join('')}</div>`:'<div class="empty">ありません</div>'}
    <h2>終わった大会 <span class="n">${past.length}件</span></h2>${past.length?`<div class="grid">${past.map(evCard).join('')}</div>`:'<div class="empty">ありません</div>'}`;
}

function viewCalendar(){
  const t=today();
  if(!ui.calMonth) ui.calMonth=t.slice(0,7);
  if(!ui.calDay) ui.calDay=t;
  const [y,m]=ui.calMonth.split('-').map(Number);
  const first=new Date(y,m-1,1), start=new Date(first); start.setDate(1-first.getDay());
  let cells='';
  for(let i=0;i<42;i++){
    const d=new Date(start); d.setDate(start.getDate()+i); const ds=ymd(d);
    if(i===35&&d.getMonth()!==m-1) break;
    const evs=S.events.filter(e=>e.date===ds);
    const ts=S.tasks.filter(x=>x.due===ds&&isOpen(x)&&mine(x));
    const rts=S.routines.filter(r=>r.kind!=='daily'&&routineOn(r,ds));
    cells+=`<div class="cell ${d.getMonth()!==m-1?'out':''} ${ds===t?'td':''} ${ds===ui.calDay?'sel':''}" data-act="calDay" data-id="${ds}">
      <span class="d">${d.getDate()}</span>
      ${evs.map(e=>`<span class="evc" style="background:${evColor(e.id)}" title="${esc(e.name)}">${esc(evName(e))}</span><span class="evd" style="background:${evColor(e.id)}"></span>`).join('')}
      ${ts.length?`<span class="cnt ${ds<t?'late':''}">${ts.length}件</span>`:''}
      ${ts.sort(byDue).slice(0,4).map(x=>`<span class="ct ${ds<t?'late':''}" title="${esc(x.title)}"><i style="background:${x.event_id?evColor(x.event_id):'var(--sub)'}"></i>${esc(x.title)}</span>`).join('')}
      ${ts.length>4?`<span class="more">ほか${ts.length-4}件</span>`:''}
      ${rts.map(r=>`<span class="rt">・${esc(r.title)}</span>`).join('')}
    </div>`;
  }
  const sd=ui.calDay;
  const dEvs=S.events.filter(e=>e.date===sd);
  const dTs=S.tasks.filter(x=>x.due===sd&&mine(x));
  const dRts=S.routines.filter(r=>routineOn(r,sd));
  return `${toolbar()}
    <div class="row" style="margin:12px 0 8px"><button class="btn sm" data-act="calMove" data-id="-1">←</button>
      <strong>${y}年${m}月</strong><button class="btn sm" data-act="calMove" data-id="1">→</button>
      <button class="btn sm" data-act="calMove" data-id="0">今月</button></div>
    <div class="cal">${WD.map(w=>`<div class="wd">${w}</div>`).join('')}${cells}</div>
    <h2>${md(sd)} の予定</h2>
    ${dEvs.map(e=>`<div class="card ev" data-act="openEvent" data-id="${e.id}" style="border-left:4px solid ${evColor(e.id)};margin-bottom:6px"><span class="nm">🏆 ${esc(evName(e))}</span>（大会日）</div>`).join('')}
    ${section(dTs,'この日が期限のタスクはありません',{headless:true})}
    ${dRts.length?`<div class="dayhead">ルーティン</div><div class="list">${dRts.map(r=>routineRow(r,sd)).join('')}</div>`:''}`;
}

function viewRoutines(){
  const single=S.tasks.filter(t=>!t.event_id);
  const openS=single.filter(t=>isOpen(t)), doneS=single.filter(t=>!isOpen(t));
  return `<h2>くり返しのタスク（ルーティン）<span class="sp"></span><button class="btn sm" data-act="newRoutine">＋ 追加</button></h2>

function viewTemplates(){
  const all=sets();
  if(!ui.setId||!setById(ui.setId)) ui.setId=all[0]&&all[0].id;
  const st=setById(ui.setId);
  const ts=S.templates.filter(t=>t.set_id===ui.setId).sort((a,b)=>a.days-b.days||catIndex(a.category)-catIndex(b.category)||bySort(a,b));
  const usedBy=S.events.filter(e=>e.set_id===ui.setId).length;
  const row=t=>`<tr class="click" data-act="editTemplate" data-id="${t.id}" style="box-shadow:inset 4px 0 0 ${catColor(t.category)}">
      <td style="white-space:nowrap">${daysLabel(t.days)}</td><td>${esc(t.title)}${t.memo?`<div class="muted">${esc(t.memo)}</div>`:''}${linksOf(t).length?`<div class="muted">🔗 ${linksOf(t).map(l=>esc(l.name)).join('・')}</div>`:''}</td>
      <td><input class="mini" type="number" min="0" step="5" value="${Number(t.effort||0)}" data-inline="effort" data-id="${t.id}" title="ここで直接書き換えられます"></td>
      <td>${ui.sort==='date'?catChip(t.category):''}${t.manual_name||t.manual_url?`<div class="muted">${t.manual_url?'🔗':'⚠️ リンク未設定'} ${esc(t.manual_name)}</div>`:''}</td></tr>`;
  const head='<tr><th style="width:80px">いつ</th><th>タスク</th><th style="width:90px">工数</th><th style="width:28%">カテゴリ・マニュアル</th></tr>';
  const sumE=a=>a.reduce((x,t)=>x+Number(t.effort||0),0);
  let body;
  if(ui.sort==='cat'){
    const cats=[...new Set(ts.map(t=>t.category))].sort((a,b)=>catIndex(a)-catIndex(b));
    body=cats.map(c=>`<h2><span class="cdot" style="--c:${catColor(c)}"></span>${esc(c)} <span class="n">${ts.filter(t=>t.category===c).length}件・工数${sumE(ts.filter(t=>t.category===c))}</span></h2><table class="tbl">${head}${ts.filter(t=>t.category===c).map(row).join('')}</table>`).join('');
  }else body=`<table class="tbl" style="margin-top:10px">${head}${ts.map(row).join('')}</table>`;
  return `<div class="note">テンプレを変えると、<b>これから登録する大会</b>に反映されます。すでに登録した大会のタスクは変わりません（大会ごとに直接直せます）。</div>
    <h2>テンプレ一式</h2>
    <div class="chips">${all.map(s=>`<button class="chip ${s.id===ui.setId?'on':''}" data-act="pickSet" data-id="${s.id}">${esc(s.name)}</button>`).join('')}
      <button class="chip" data-act="newSet">＋ 新しいテンプレ</button></div>
    ${st?`<div class="card" style="margin-top:10px"><div class="row"><b>${esc(st.name)}</b><span class="muted">${ts.length}件・合計工数${sumE(ts)}・この型で登録した大会 ${usedBy}件</span><span class="sp"></span>
        <button class="btn sm" data-act="editSet" data-id="${st.id}">名前・説明を変更</button></div>${st.memo?`<div class="muted">${esc(st.memo)}</div>`:''}</div>
    <div class="muted" style="margin-top:8px">工数の欄は、その場で数字を書き換えるだけで保存されます（1工数＝1分が目安）。</div>
    <div class="row" style="margin-top:8px">${sortChips()}<span class="sp"></span><button class="btn pri sm" data-act="newTemplate">＋ このテンプレにタスクを追加</button></div>
    ${ts.length?body:'<div class="empty">まだタスクがありません</div>'}`:''}
    <h2>カテゴリの管理</h2>
    <div class="card">
      <div class="muted" style="margin-bottom:8px">左の色を押すと、カテゴリの色を変えられます。並び順は「カテゴリ別」で表示するときの順番になります。名前を変えると、テンプレと登録済みのタスクのカテゴリ名もまとめて変わります。</div>
      <div class="list" style="gap:4px">${[...S.categories].sort(bySort).map((c,i,a)=>{const n=S.templates.filter(t=>t.category===c.name).length+S.tasks.filter(t=>t.category===c.name).length;
        return `<div class="row"><input type="color" class="colorpick" value="${catColor(c.name)}" data-catcolor="${c.id}" title="押すと色を変えられます"><span style="flex:1">${esc(c.name)} <span class="muted">（${n}件で使用）</span></span>
          <button class="btn sm" data-act="catMove" data-id="${c.id}" data-dir="-1" ${i===0?'disabled':''}>↑</button>
          <button class="btn sm" data-act="catMove" data-id="${c.id}" data-dir="1" ${i===a.length-1?'disabled':''}>↓</button>
          <button class="btn sm" data-act="catRename" data-id="${c.id}">名前変更</button>
          <button class="btn sm dan" data-act="catDelete" data-id="${c.id}">削除</button></div>`}).join('')}</div>

let modalSubmit=null;
function openModal(title,body,onSubmit,{danger,after=''}={}){
  closeModal();
  const ov=document.createElement('div'); ov.className='ov';
  ov.innerHTML=`<div class="modal"><form data-form="modal"><h3>${esc(title)}</h3>${body}
    <div class="foot">${danger?`<button type="button" class="btn dan" data-act="modalDanger">${esc(danger.label)}</button>`:''}<span class="sp"></span>
    <button type="button" class="btn" data-act="closeModal">閉じる</button><button class="btn pri">保存</button></div></form>${after}</div>`;
  ov.addEventListener('mousedown',e=>{if(e.target===ov) closeModal()});
  document.body.appendChild(ov);
  modalSubmit=onSubmit; ov._danger=danger&&danger.fn;
  const f=ov.querySelector('input:not([type=checkbox]),textarea,select'); if(f) f.focus();
  return ov;
}
function closeModal(){document.querySelectorAll('.ov').forEach(o=>o.remove());modalSubmit=null}
const memberOptions=sel=>`<option value="">（未定）</option>${S.members.map(m=>`<option value="${m.id}" ${m.id===sel?'selected':''}>${esc(m.name)}</option>`).join('')}`;

function threadHtml(taskId){
  const cs=commentsOf(taskId).sort((a,b)=>a.created_at<b.created_at?-1:1), me=myEmail();
  return `${cs.map(c=>`<div class="cmt"><div class="ch"><b>${esc(c.author_name||c.author_email)}</b><span class="muted">${fmtTime(c.created_at)}</span><span class="sp"></span>
      ${c.author_email===me?`<button type="button" class="btn sm" data-act="delComment" data-id="${c.id}" data-task="${taskId}">削除</button>`:''}</div>
      <div class="cb">${esc(c.body).replace(/\n/g,'<br>')}</div></div>`).join('')||'<div class="empty" style="padding-top:0">まだやり取りはありません</div>'}
    ${cs.length?seenHtml(taskId,cs[cs.length-1]):''}
    <div class="row" style="align-items:flex-end;flex-wrap:nowrap"><textarea id="cbody" class="inp" placeholder="ほかのスタッフへの連絡・相談など（⌘+Enterで送信）"></textarea>
      <button type="button" class="btn pri" data-act="postComment" data-id="${taskId}">送信</button></div>`;

function seenHtml(taskId,last){
  const names=S.comment_reads.filter(r=>r.task_id===taskId&&r.user_email!==last.author_email&&tms(r.read_at)>=tms(last.created_at))
    .map(r=>{const st=S.staff.find(x=>x.email===r.user_email);return st&&st.name?st.name:r.user_email.split('@')[0]});
  return `<div class="seen">${names.length?'既読：'+names.map(esc).join('・'):'まだ誰も読んでいません'}</div>`;
}

/* 大会の登録：テンプレを選ぶ → いらないタスクのチェックを外す */
function pickHtml(setId,date){
  const ts=S.templates.filter(t=>t.set_id===setId);
  if(!ts.length) return '<div class="empty">このテンプレにはタスクがありません</div>';
  const cats=[...new Set(ts.map(t=>t.category))].sort((a,b)=>catIndex(a)-catIndex(b));
  return cats.map(c=>{const items=ts.filter(t=>t.category===c).sort((a,b)=>a.days-b.days||bySort(a,b));
    return `<label class="ck pcat"><input type="checkbox" data-cattoggle="${esc(c)}" checked> <span class="cdot" style="--c:${catColor(c)}"></span>${esc(c)} <span class="muted">（${items.length}件）</span></label>
      ${items.map(t=>`<label class="ck it"><input type="checkbox" name="tpl" value="${t.id}" data-cat="${esc(c)}" checked>
        <span><span class="d">${daysLabel(t.days)}</span>${esc(t.title)}${date?` <span class="muted">→ ${md(addDays(date,t.days))}</span>`:''}</span></label>`).join('')}`}).join('');
}
function previewEvent(form){
  const pv=form.querySelector('#pv'); if(!pv) return;
  const date=form.date.value;
  const ids=[...form.querySelectorAll('[name=tpl]:checked')].map(x=>x.value);
  const late=date?S.templates.filter(t=>ids.includes(t.id)&&addDays(date,t.days)<today()).length:0;
  pv.innerHTML=`<b>${ids.length}件</b>のタスクが作られます。${late?`<div class="alert">うち${late}件は、すでに期限を過ぎた状態で作られます（期限切れとして表示されます）。</div>`:''}`;
}
function syncCatToggles(form){
  form.querySelectorAll('[data-cattoggle]').forEach(ct=>{
    const items=[...form.querySelectorAll('[name=tpl]')].filter(x=>x.dataset.cat===ct.dataset.cattoggle);
    const n=items.filter(x=>x.checked).length;
    ct.checked=n===items.length; ct.indeterminate=n>0&&n<items.length;
  });
}
function newEvent(){

      <div class="f"><label>大会形式（任意）</label><input name="format" list="formats" placeholder="例：シリーズ戦">${datalist('formats',S.events.map(e=>e.format))}</div></div>
    <div class="lbl">作るタスク（この大会でいらないものはチェックを外す）</div>

    <div class="muted" id="pv"></div>
    <div class="f" style="margin-top:10px"><label>メモ</label><textarea name="memo"></textarea></div>`,fd=>{
      const e={id:uid(),name:fd.name,short:(fd.short||'').trim(),date:fd.date,set_id:fd.set_id||null,venue:fd.venue||'',format:fd.format||'',tags:[],memo:fd.memo||''};
      const ids=fd.tpl||[];
      const ts=tasksFromTemplates(e,S.templates.filter(t=>ids.includes(t.id)));
      put('events',e); put('tasks',ts);
      closeModal(); ui.tab='events'; ui.eventId=e.id; render(); window.scrollTo(0,0); toast(`登録しました。タスクを${ts.length}件作りました`);
  });
  const form=ov.querySelector('form');
  form.addEventListener('change',e=>{
    const el=e.target;
    if(el.name==='set_id'){form.querySelector('#pick').innerHTML=pickHtml(el.value,form.date.value)}
    else if(el.name==='date'){const keep=new Set([...form.querySelectorAll('[name=tpl]:not(:checked)')].map(x=>x.value));

    else if(el.dataset.cattoggle!==undefined){form.querySelectorAll('[name=tpl]').forEach(x=>{if(x.dataset.cat===el.dataset.cattoggle)x.checked=el.checked})}

      const n=S.templates.filter(t=>t.set_id===id).length;
      if(confirm(`テンプレ「${st.name}」と、その中のタスク${n}件を削除します。登録済みの大会のタスクは残ります。よろしいですか？`)){
        del('templates',S.templates.filter(t=>t.set_id===id).map(t=>t.id)); del('template_sets',id); ui.setId=null; closeModal();
      }}}:null});
}

function editRoutine(id){
  const isNew=!id;
  const base=isNew?{id:uid(),title:'',kind:'weekly',dow:4,dom:null,assignee:null,manual_url:'',memo:'',sort:S.routines.length}:S.routines.find(x=>x.id===id);
  openModal(isNew?'ルーティンを追加':'ルーティンを編集',`
    <div class="f"><label>タスク</label><input name="title" value="${esc(base.title)}" required></div>
    <div class="f2"><div class="f"><label>くり返し</label><select name="kind"><option value="daily" ${base.kind==='daily'?'selected':''}>毎日</option><option value="weekly" ${base.kind==='weekly'?'selected':''}>毎週</option><option value="monthly" ${base.kind==='monthly'?'selected':''}>毎月</option></select></div>
      <div class="f"><label>曜日（毎週のとき）／日にち（毎月のとき）</label><div class="row" style="flex-wrap:nowrap">
        <select name="dow">${WD.map((w,i)=>`<option value="${i}" ${Number(base.dow)===i?'selected':''}>${w}曜</option>`).join('')}</select>
        <input name="dom" type="number" min="1" max="31" value="${base.dom||1}" style="width:70px"><span class="muted">日</span></div></div></div>
    <div class="f"><label>担当</label><select name="assignee">${memberOptions(base.assignee)}</select></div>
    <div class="f"><label>マニュアルのリンク</label><input name="manual_url" type="url" value="${esc(base.manual_url)}"></div>
    <div class="f"><label>備考</label><textarea name="memo">${esc(base.memo)}</textarea></div>`,fd=>{
      put('routines',{...base,title:fd.title,kind:fd.kind,dow:fd.kind==='weekly'?Number(fd.dow):null,dom:fd.kind==='monthly'?Number(fd.dom):null,assignee:fd.assignee||null,manual_url:fd.manual_url,memo:fd.memo});
      closeModal(); toast('保存しました');
    },{danger:isNew?null:{label:'削除',fn:()=>{if(confirm(`「${base.title}」を削除します。よろしいですか？`)){del('routine_checks',S.routine_checks.filter(c=>c.routine_id===base.id).map(c=>c.id));del('routines',base.id);closeModal()}}}});
}

/* ---------- 操作 ---------- */
const ACT={
  tab:d=>{ui.tab=d.id;ui.eventId=null;render();window.scrollTo(0,0)},
  who:d=>{ui.who=d.id;lsSet('mm_who',d.id);render()},
  period:d=>{ui.period=d.id;render()},
  sort:d=>{ui.sort=d.id;lsSet('mm_sort',d.id);render()},
  cycle:d=>{const t=S.tasks.find(x=>x.id===d.id);const nx={todo:'wip',wip:'done',done:'todo',skip:'todo'}[t.status]||'todo';put('tasks',withStatus(t,nx));toast(`「${t.title}」を${STATUS[nx][1]}にしました`)},
  skip:d=>{const t=S.tasks.find(x=>x.id===d.id);put('tasks',withStatus(t,'skip'));toast(`「${t.title}」を不要にしました（丸を押すと戻せます）`)},
  editTask:d=>{closeModal();editTask(d.id)},
  openChat:d=>openChat(d.id),
  editWho:d=>editWho(d.id),
  addLinkRow:()=>document.getElementById('links').insertAdjacentHTML('beforeend',linkRowHtml({})),
  delLinkRow:(d,el)=>el.closest('.lrow').remove(),
  newTask:d=>editTask(null,d.id),
  postComment:d=>{const ta=document.getElementById('cbody');const body=(ta.value||'').trim();if(!body)return;
    put('comments',{id:uid(),task_id:d.id,body,author_email:myEmail(),author_name:myName(),created_at:new Date().toISOString()});
    S.comment_reads=S.comment_reads.filter(x=>x.id!==readId(d.id));
    put('comment_reads',{id:readId(d.id),user_email:myEmail(),task_id:d.id,read_at:new Date(Date.now()+1000).toISOString()});
    document.getElementById('thread').innerHTML=threadHtml(d.id);const ta2=document.getElementById('cbody');if(ta2)ta2.focus();},
  delComment:d=>{if(!confirm('このメッセージを削除します。よろしいですか？'))return;del('comments',d.id);document.getElementById('thread').innerHTML=threadHtml(d.task)},
  checkRoutine:d=>{const c=S.routine_checks.find(x=>x.routine_id===d.id&&x.date===d.day);
    if(c) del('routine_checks',c.id); else put('routine_checks',{id:uid(),routine_id:d.id,date:d.day});},
  editRoutine:d=>editRoutine(d.id), newRoutine:()=>editRoutine(null),
  openEvent:d=>{ui.tab='events';ui.eventId=d.id;render();window.scrollTo(0,0)},
  back:()=>{ui.eventId=null;render()},
  evFilter:d=>{ui.evFilter=d.id;render()},
  newEvent:()=>{if(!sets().length){toast('先に「テンプレ」でテンプレを作ってください');return}newEvent()}, editEvent:d=>editEvent(d.id),
  pickSet:d=>{ui.setId=d.id;render()}, newSet:()=>newSet(), editSet:d=>editSet(d.id),
  editTemplate:d=>editTemplate(d.id), newTemplate:()=>editTemplate(null),
  catMove:d=>{const list=[...S.categories].sort(bySort);const i=list.findIndex(c=>c.id===d.id),j=i+Number(d.dir);if(j<0||j>=list.length)return;
    [list[i],list[j]]=[list[j],list[i]];put('categories',list.map((c,k)=>({...c,sort:k})))},
  catRename:d=>{const c=S.categories.find(x=>x.id===d.id);const nn=(prompt(`「${c.name}」の新しい名前`,c.name)||'').trim();
    if(!nn||nn===c.name)return; if(S.categories.some(x=>x.name===nn)){alert('その名前のカテゴリはもうあります');return}
    const old=c.name; put('categories',{...c,name:nn});
    put('templates',S.templates.filter(t=>t.category===old).map(t=>({...t,category:nn})));
    put('tasks',S.tasks.filter(t=>t.category===old).map(t=>({...t,category:nn}))); toast('名前を変えました')},
  catDelete:d=>{const c=S.categories.find(x=>x.id===d.id);
    const n=S.templates.filter(t=>t.category===c.name).length+S.tasks.filter(t=>t.category===c.name).length;
    if(c.name==='その他'&&n){alert('「その他」は、使っているタスクがある間は削除できません');return}
    if(!confirm(n?`「${c.name}」を削除します。使っている${n}件は「その他」に移ります。よろしいですか？`:`「${c.name}」を削除します。よろしいですか？`))return;
    if(n){ if(!S.categories.some(x=>x.name==='その他')) put('categories',{id:uid(),name:'その他',sort:S.categories.length});
      put('templates',S.templates.filter(t=>t.category===c.name).map(t=>({...t,category:'その他'})));
      put('tasks',S.tasks.filter(t=>t.category===c.name).map(t=>({...t,category:'その他'}))); }
    del('categories',c.id)},
  calDay:d=>{ui.calDay=d.id;render()},
  calMove:d=>{const n=Number(d.id);if(!n){ui.calMonth=today().slice(0,7);ui.calDay=today()}else{const [y,m]=ui.calMonth.split('-').map(Number);const x=new Date(y,m-1+n,1);ui.calMonth=ymd(x).slice(0,7)}render()},
  delMember:d=>{const m=S.members.find(x=>x.id===d.id);if(confirm(`「${m.name}」を削除します。担当になっているタスクは「担当未定」に戻ります。よろしいですか？`)){
    put('tasks',S.tasks.filter(t=>t.assignee===m.id).map(t=>({...t,assignee:null})));
    put('routines',S.routines.filter(t=>t.assignee===m.id).map(t=>({...t,assignee:null})));
    if(ui.who===m.id){ui.who='';lsSet('mm_who','')} del('members',m.id)}},
  closeModal:()=>closeModal(),
  modalDanger:()=>{const ov=document.querySelector('.ov');ov&&ov._danger&&ov._danger()},
  exportData:()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download=`モルマニタスク_控え_${today()}.json`;a.click()},
  importData:()=>{const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=async()=>{try{const d=JSON.parse(await i.files[0].text());
    if(!confirm('今のデータを、読み込んだファイルの中身で置き換えます。よろしいですか？'))return;for(const t of TABLES)S[t]=d[t]||[];fillMissing();LocalDB.save();render();toast('読み込みました')}catch(e){toast('読み込めませんでした')}};i.click()},
  resetDemo:()=>{if(confirm('このブラウザに入っているデータを消して、お試しデータに戻します。よろしいですか？')){for(const t of TABLES)S[t]=[];seedDemo();LocalDB.save();render();toast('お試しデータに戻しました')}},
  logout:async()=>{await CloudDB.sb.auth.signOut();location.reload()},
  loginMode:d=>renderLogin('',d.id),
  renameStaff:async d=>{const x=S.staff.find(y=>y.email===d.id);const nn=(prompt('表示する名前（やり取り・実績に出ます）',x.name)||'').trim();if(!nn||nn===x.name)return;
    const {error}=await CloudDB.sb.from('staff_access').update({name:nn}).eq('email',x.email);
    if(error){toast('変更できませんでした：'+error.message);return} x.name=nn;render();toast('名前を変えました')},
  delStaff:async d=>{const x=S.staff.find(y=>y.email===d.id);
    if(!confirm(`${x.name||x.email} をログインできる人から外します。この人はすぐにアプリを見られなくなります。よろしいですか？`))return;
    const {error}=await CloudDB.sb.from('staff_access').delete().eq('email',x.email);
    if(error){toast('外せませんでした：'+error.message);return}
    S.staff=S.staff.filter(y=>y.email!==x.email);render();toast('外しました')},
  toggleAdmin:async d=>{const x=S.staff.find(y=>y.email===d.id);
    const {error}=await CloudDB.sb.from('staff_access').update({is_admin:!x.is_admin}).eq('email',x.email);
    if(error){toast('変更できませんでした：'+error.message);return}
    x.is_admin=!x.is_admin;render();toast('変更しました')},
};
document.addEventListener('click',e=>{
  if(e.target.closest('a[href]:not([href="#"])')) return;
  if(['INPUT','SELECT','TEXTAREA','OPTION'].includes(e.target.tagName)) return;
  const el=e.target.closest('[data-act]'); if(!el) return;
  e.preventDefault(); const f=ACT[el.dataset.act]; if(f) f(el.dataset,el,e);
});
const ARRAY_FIELDS=['tpl','link_name','link_url'];
/* カテゴリの色を変える */
document.addEventListener('change',e=>{const el=e.target;if(!el.dataset||!el.dataset.catcolor)return;
  const c=S.categories.find(x=>x.id===el.dataset.catcolor);if(c){put('categories',{...c,color:el.value});toast(`「${c.name}」の色を変えました`)}});
/* テンプレ一覧で工数をその場で書き換える */
document.addEventListener('change',e=>{const el=e.target;if(!el.dataset||el.dataset.inline!=='effort')return;
  const t=S.templates.find(x=>x.id===el.dataset.id);if(!t)return;const v=Math.max(0,parseInt(el.value||'0',10)||0);
  if(v===Number(t.effort||0))return;put('templates',{...t,effort:v});toast(`「${t.title}」の工数を${v}にしました`)});
/* ⌘+Enter でチャット送信 */
document.addEventListener('keydown',e=>{if(e.target.id==='cbody'&&e.key==='Enter'&&(e.metaKey||e.ctrlKey)){e.preventDefault();const b=document.querySelector('[data-act=postComment]');if(b)b.click()}});
/* 新しいチャットを30秒ごとに取りに行く */
async function pollChat(){
  if(DB.mode!=='cloud'||!ui.user||ui.noAccess||document.visibilityState!=='visible') return;
  try{const [a,b]=await Promise.all([CloudDB.sb.from('comments').select('*').range(0,9999),CloudDB.sb.from('comment_reads').select('*').range(0,9999)]);
    if(a.error||b.error) return;
    const sig=x=>x.map(c=>c.id+(c.read_at||'')).sort().join();
    if(sig(a.data)===sig(S.comments)&&sig(b.data)===sig(S.comment_reads)) return;
    S.comments=a.data; S.comment_reads=b.data; render();
    const th=document.getElementById('thread'); if(th&&th.dataset.task){const v=(document.getElementById('cbody')||{}).value||'';th.innerHTML=threadHtml(th.dataset.task);const ta=document.getElementById('cbody');if(ta)ta.value=v;markRead(th.dataset.task)}
  }catch(e){}
}
setInterval(pollChat,30000);
document.addEventListener('submit',async e=>{
  const form=e.target; const kind=form.dataset.form; if(!kind) return;
  e.preventDefault();
  const fd={}; for(const [k,v] of new FormData(form)){ if(ARRAY_FIELDS.includes(k)){(fd[k]=fd[k]||[]).push(v)} else fd[k]=v }
  if(kind==='modal'){ if(modalSubmit) modalSubmit(fd); }
  if(kind==='addMember'){ put('members',{id:uid(),name:fd.name.trim(),sort:S.members.length}); }
  if(kind==='addCategory'){ const n=fd.name.trim(); if(S.categories.some(c=>c.name===n)){toast('その名前のカテゴリはもうあります');return}
    put('categories',{id:uid(),name:n,sort:S.categories.length}); toast('追加しました'); }
  if(kind==='addStaff'){
    const row={email:fd.email.trim().toLowerCase(),name:fd.name.trim(),is_admin:!!fd.is_admin};
    const {error}=await CloudDB.sb.from('staff_access').insert(row);
    if(error){toast(/duplicate/.test(error.message)?'そのメールアドレスはもう入っています':'追加できませんでした：'+error.message);return}
    S.staff.push(row);
    if(fd.as_member&&!S.members.some(m=>m.name===row.name)) put('members',{id:uid(),name:row.name,sort:S.members.length});
    render(); toast(`${row.name}さんを追加しました。「はじめての方」から登録するよう伝えてください`);
  }
  if(kind==='signup'){
    if(fd.password!==fd.password2){renderLogin('パスワードが2回とも同じになっていません','signup');return}
    const {data,error}=await CloudDB.sb.auth.signUp({email:fd.email.trim().toLowerCase(),password:fd.password});
    if(error){renderLogin(/許可|not allowed|hook/i.test(error.message)?'このメールアドレスはまだ登録が許可されていません。管理者に追加してもらってください。':/registered|exists/i.test(error.message)?'このメールアドレスはもう登録済みです。「ログイン」から入ってください。':'登録できませんでした：'+error.message,'signup');return}
    if(!data.session){renderLogin('登録しました。「ログイン」から入ってください。','login');return}
    location.reload();
  }
  if(kind==='login'){
    const {error}=await CloudDB.sb.auth.signInWithPassword({email:fd.email,password:fd.password});
    if(error){renderLogin('ログインできませんでした。メールアドレスとパスワードを確かめてください。');return}
    location.reload();
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
/* 新しい版が公開されたら、上にお知らせを出す */
async function checkVersion(){
  if(location.protocol==='file:') return;
  try{const r=await fetch(location.pathname+'?v='+Date.now(),{cache:'no-store'});const m=(await r.text()).match(/APP_VERSION='([^']+)'/);
    if(m&&m[1]!==APP_VERSION) document.getElementById('newver').style.display='flex';}catch(e){}
}
setInterval(checkVersion,5*60*1000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkVersion()});
document.addEventListener('visibilitychange',async()=>{
  if(document.visibilityState==='visible'&&DB.mode==='cloud'&&ui.user&&!ui.noAccess&&!document.querySelector('.ov')){try{await DB.loadAll();render()}catch(e){}}
});

(async function boot(){
  try{
    const ok=await DB.init();
    if(!ok){renderLogin();return}
    await DB.loadAll();
    if(ui.noAccess){renderNoAccess();return}
    render();
  }catch(e){
    const hint=/does not exist|schema cache|Could not find/i.test(e.message)?'<p class="muted">Supabase に「追加で貼る文章」がまだ反映されていない可能性があります。</p>':'';
    document.getElementById('app').innerHTML=`<div class="login"><div class="alert">読み込みに失敗しました：${esc(e.message)}</div>${hint}</div>`;
  }
})();
</script>
